{% extends 'pipes/base.html' %}

{% block content %}

<div class="container py-5">

<h2 class="text-center mb-4">
Can't Find Your Product?
</h2>

<p class="text-center text-muted mb-5">
Upload product details and image. We'll help you find it.
</p>

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<div class="row">

<div class="col-md-6 mb-3">
<label>Name</label>
<input type="text" class="form-control" name="name" required>
</div>

<div class="col-md-6 mb-3">
<label>Email</label>
<input type="email" class="form-control" name="email" required>
</div>

<div class="col-md-6 mb-3">
<label>Phone</label>
<input type="text" class="form-control" name="phone" required>
</div>

<div class="col-md-6 mb-3">
<label>Company</label>
<input type="text" class="form-control" name="company">
</div>

<div class="col-md-6 mb-3">
<label>Vehicle Company</label>
<input type="text" class="form-control" name="vehicle_company" required>
</div>

<div class="col-md-6 mb-3">
<label>Vehicle Model</label>
<input type="text" class="form-control" name="vehicle_model" required>
</div>

<div class="col-md-6 mb-3">
<label>Part Name</label>
<input type="text" class="form-control" name="part_name" required>
</div>

<div class="col-md-6 mb-3">
<label>Part Number</label>
<input type="text" class="form-control" name="part_number">
</div>

<div class="col-md-6 mb-3">
<label>Quantity</label>
<input type="number" class="form-control" name="quantity" value="1">
</div>

<div class="col-md-6 mb-3">
<label>Upload Product Image</label>
<input type="file" class="form-control" name="image">
</div>

<div class="col-12 mb-3">
<label>Description</label>
<textarea class="form-control" rows="5" name="description"></textarea>
</div>

<div class="col-12 text-center">

<button class="btn btn-primary btn-lg">

Submit Request

</button>

</div>

</div>

</form>

</div>

{% endblock %}
