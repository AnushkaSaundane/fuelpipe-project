{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <h2 class="text-center mb-4">
        Can't Find Your Product?
    </h2>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <div class="mb-3">
            <label>Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Phone</label>
            <input type="text" name="phone" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Vehicle Company</label>
            <input type="text" name="vehicle_company" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Vehicle Model</label>
            <input type="text" name="vehicle_model" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Vehicle Year</label>
            <input type="text" name="vehicle_year" class="form-control">
        </div>

        <div class="mb-3">
            <label>Part Name</label>
            <input type="text" name="part_name" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Part Number</label>
            <input type="text" name="part_number" class="form-control">
        </div>

        <div class="mb-3">
            <label>Upload Product Image</label>
            <input type="file" name="image" class="form-control">
        </div>

        <div class="mb-3">
            <label>Description</label>
            <textarea name="description" rows="5" class="form-control"></textarea>
        </div>

        <button class="btn btn-primary w-100">
            Submit Request
        </button>

    </form>

</div>

{% endblock %}
